name: Build and Package

on:
  # Every branch, not just main. A long-lived branch - the Bubble Bobble port
  # is one - otherwise goes unbuilt until the day it opens a pull request, and
  # a commit nothing has built is a commit nobody knows is good.
  #
  # The packaging and publishing steps below stay pegged to main, so a feature
  # branch gets the build and the tests and none of the artefact churn.
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

env:
  # The one place the steps below ask "is this main?".
  IS_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # MinVer needs full history (and tags) to compute the version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install minver-cli and ReportGenerator
        run: |
          dotnet tool install --global minver-cli
          dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Compute version
        id: vars
        run: echo "version=$(minver)" >> $GITHUB_OUTPUT

      - name: Build solution
        run: dotnet build --configuration Release

      - name: Run unit tests with coverage
        # Release builds strip PDBs (Directory.Build.props), so force portable
        # PDBs back on for this build+test pass only - the coverage collector
        # needs them to map hits to source lines.
        # The two levels run as separate steps so a broken unit test is named
        # before the slower integration level runs at all. Both write into the
        # same folder, one cobertura file per project per step, and
        # ReportGenerator merges them. Merging in the collector instead counts
        # a line once per project that loaded it and keeps the lowest run
        # rather than the union.
        run: dotnet test --configuration Release -p:DebugType=portable -p:DebugSymbols=true --coverage --coverage-output-format cobertura --results-directory ./TestResults -- --filter-not-trait "Level=Integration"

      - name: Run integration tests with coverage
        # Only EliteSharpLib.Tests, StuntCarRacerSharpLib.Tests and
        # BubbleBobbleSharpLib.Tests carry any Level=Integration tests, so
        # every other project matches none. The
        # runner treats a project with zero matching tests as a failure
        # (exit code 8) even though nothing is actually wrong, so that one
        # code is ignored here - a real test failure still exits non-zero.
        run: dotnet test --configuration Release -p:DebugType=portable -p:DebugSymbols=true --coverage --coverage-output-format cobertura --results-directory ./TestResults -- --filter-trait "Level=Integration" --ignore-exit-code 8

      - name: Generate coverage report and badge
        # SharpKind.SDL is excluded: it is the P/Invoke layer over SDL3 and
        # every line of it needs a live window, audio device or gamepad. The
        # pure parts of it - the key table, the font rasteriser choice - are
        # tested and counted through SharpKind.SDL.Tests, which the filter
        # keeps out of the denominator rather than the numerator. Counting the
        # bindings only made the figure say the game is less tested than it is.
        run: reportgenerator -reports:"TestResults/*.cobertura.xml" -targetdir:coveragereport -reporttypes:"Cobertura;Badges" "-assemblyfilters:-*.Tests;-*.Fakes;-*.Benchmarks;-*.TestPlugin;-SharpKind.SDL"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coveragereport/Cobertura.xml

      - name: Update coverage badge file
        if: env.IS_MAIN == 'true'
        # ReportGenerator emits the badge with CRLF, but .gitattributes normalizes
        # to LF on staging - so a copied-but-unchanged badge stages as a no-op and
        # create-pull-request fails on the empty commit. Strip the CRs up front.
        run: tr -d '\r' < coveragereport/badge_linecoverage.svg > docs/images/coverage-badge.svg

      - name: Create coverage badge PR
        if: env.IS_MAIN == 'true'
        id: badge-pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update coverage badge [skip ci]"
          title: "Update coverage badge"
          body: Automated coverage badge update.
          branch: chore/coverage-badge
          delete-branch: true
          add-paths: docs/images/coverage-badge.svg

      - name: Enable auto-merge for badge PR
        if: steps.badge-pr.outputs.pull-request-number
        continue-on-error: true
        run: gh pr merge --auto --squash "${{ steps.badge-pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack SharpKind libraries
        if: env.IS_MAIN == 'true'
        # Pack only the publishable SharpKind.* libraries under src/useful/libs
        # (IsPackable=true there) - not the EliteSharp/StuntCarRacerSharp game
        # projects, which are not meant to be published as NuGet packages.
        run: |
          for proj in src/useful/libs/*/*.csproj; do
            dotnet pack "$proj" --configuration Release --no-build --output ./nupkg
          done

      - name: Upload SharpKind NuGet packages
        if: env.IS_MAIN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: SharpKind-nupkgs-${{ steps.vars.outputs.version }}
          path: ./nupkg/*.nupkg

      - name: Publish EliteSharp Windows
        if: env.IS_MAIN == 'true'
        run: dotnet publish ./src/elite/apps/EliteSharp/EliteSharp.csproj /p:PublishProfile=PublishProfileWindows

      - name: Delete superfluous files
        if: env.IS_MAIN == 'true'
        run: find ./publish/EliteSharp/win-x64 \( -name "*.xml" -o -name "*.ico" \) -type f -delete

      - name: Upload artifact
        if: env.IS_MAIN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: EliteSharp-Windows-${{ steps.vars.outputs.version }}
          path: ./publish/EliteSharp/win-x64/*

      - name: Publish EliteSharp Linux
        if: env.IS_MAIN == 'true'
        run: dotnet publish ./src/elite/apps/EliteSharp/EliteSharp.csproj /p:PublishProfile=PublishProfileLinux

      - name: Delete superfluous files
        if: env.IS_MAIN == 'true'
        run: find ./publish/EliteSharp/linux-x64 \( -name "*.xml" -o -name "*.ico" \) -type f -delete

      - name: Upload artifact
        if: env.IS_MAIN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: EliteSharp-Linux-${{ steps.vars.outputs.version }}
          path: ./publish/EliteSharp/linux-x64/*

      - name: Publish StuntCarRacerSharp Windows
        if: env.IS_MAIN == 'true'
        run: dotnet publish ./src/scr/apps/StuntCarRacerSharp/StuntCarRacerSharp.csproj /p:PublishProfile=PublishProfileWindows

      - name: Delete superfluous files
        if: env.IS_MAIN == 'true'
        run: find ./publish/StuntCarRacerSharp/win-x64 \( -name "*.xml" -o -name "*.ico" \) -type f -delete

      - name: Upload artifact
        if: env.IS_MAIN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: StuntCarRacerSharp-Windows-${{ steps.vars.outputs.version }}
          path: ./publish/StuntCarRacerSharp/win-x64/*

      - name: Publish StuntCarRacerSharp Linux
        if: env.IS_MAIN == 'true'
        run: dotnet publish ./src/scr/apps/StuntCarRacerSharp/StuntCarRacerSharp.csproj /p:PublishProfile=PublishProfileLinux

      - name: Delete superfluous files
        if: env.IS_MAIN == 'true'
        run: find ./publish/StuntCarRacerSharp/linux-x64 \( -name "*.xml" -o -name "*.ico" \) -type f -delete

      - name: Upload artifact
        if: env.IS_MAIN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: StuntCarRacerSharp-Linux-${{ steps.vars.outputs.version }}
          path: ./publish/StuntCarRacerSharp/linux-x64/*

      - name: Publish BubbleBobbleSharp Windows
        if: env.IS_MAIN == 'true'
        run: dotnet publish ./src/bb/apps/BubbleBobbleSharp/BubbleBobbleSharp.csproj /p:PublishProfile=PublishProfileWindows

      - name: Delete superfluous files
        if: env.IS_MAIN == 'true'
        run: find ./publish/BubbleBobbleSharp/win-x64 \( -name "*.xml" -o -name "*.ico" \) -type f -delete

      - name: Upload artifact
        if: env.IS_MAIN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: BubbleBobbleSharp-Windows-${{ steps.vars.outputs.version }}
          path: ./publish/BubbleBobbleSharp/win-x64/*

      - name: Publish BubbleBobbleSharp Linux
        if: env.IS_MAIN == 'true'
        run: dotnet publish ./src/bb/apps/BubbleBobbleSharp/BubbleBobbleSharp.csproj /p:PublishProfile=PublishProfileLinux

      - name: Delete superfluous files
        if: env.IS_MAIN == 'true'
        run: find ./publish/BubbleBobbleSharp/linux-x64 \( -name "*.xml" -o -name "*.ico" \) -type f -delete

      - name: Upload artifact
        if: env.IS_MAIN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: BubbleBobbleSharp-Linux-${{ steps.vars.outputs.version }}
          path: ./publish/BubbleBobbleSharp/linux-x64/*
