name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # MinVer needs full history (and tags) to compute the version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pack SharpKind libraries
        # Pack only the publishable SharpKind.* libraries under src/useful/libs
        # (IsPackable=true there) - not the EliteSharp/StuntCarRacerSharp game
        # projects, which are not meant to be published as NuGet packages.
        run: |
          for proj in src/useful/libs/*/*.csproj; do
            dotnet pack "$proj" --configuration Release --output ./nupkg
          done

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: Hawky

      - name: Push SharpKind packages to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish EliteSharp win-x64
        run: dotnet publish ./src/elite/apps/EliteSharp/EliteSharp.csproj /p:PublishProfile=PublishProfileWindows

      - name: Publish EliteSharp linux-x64
        run: dotnet publish ./src/elite/apps/EliteSharp/EliteSharp.csproj /p:PublishProfile=PublishProfileLinux

      - name: Publish EliteSharp linux-arm64
        run: dotnet publish ./src/elite/apps/EliteSharp/EliteSharp.csproj /p:PublishProfile=PublishProfileLinuxArm64

      - name: Publish StuntCarRacerSharp win-x64
        run: dotnet publish ./src/scr/apps/StuntCarRacerSharp/StuntCarRacerSharp.csproj /p:PublishProfile=PublishProfileWindows

      - name: Publish StuntCarRacerSharp linux-x64
        run: dotnet publish ./src/scr/apps/StuntCarRacerSharp/StuntCarRacerSharp.csproj /p:PublishProfile=PublishProfileLinux

      - name: Publish StuntCarRacerSharp linux-arm64
        run: dotnet publish ./src/scr/apps/StuntCarRacerSharp/StuntCarRacerSharp.csproj /p:PublishProfile=PublishProfileLinuxArm64

      - name: Delete superfluous files
        run: find ./publish \( -name "*.xml" -o -name "*.ico" \) -type f -delete

      - name: Zip published artifacts
        run: |
          set -e
          mkdir -p dist
          for app_dir in ./publish/*/; do
            app=$(basename "$app_dir")
            for rid_dir in "$app_dir"*/; do
              rid=$(basename "$rid_dir")
              (cd "$rid_dir" && zip -r "$GITHUB_WORKSPACE/dist/${app}-${rid}-${{ github.ref_name }}.zip" .)
            done
          done

      - name: Install PowerShell 7.6
        # The libraries target .NET 10, which PowerShell 7.6 is the first to run on. The runner's
        # own pwsh may be older, so install the global tool and put it first on the PATH.
        run: |
          dotnet tool install --global PowerShell --version '7.6.*'
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Build SharpKind.Cryptography module
        # After the zip step above, which would otherwise take the module's lib folder for a runtime.
        shell: pwsh
        run: ./src/useful/apps/SharpKind.Cryptography.PowerShell/build.ps1

      - name: Zip SharpKind.Cryptography module
        # The zip holds the module folder, so it extracts straight into a PSModulePath folder.
        run: (cd ./publish && zip -r "$GITHUB_WORKSPACE/dist/SharpKind.Cryptography-${{ github.ref_name }}.zip" SharpKind.Cryptography)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
          body: |
            StuntCarRacerSharp builds are a **preview** release — see the open defects list in [docs/backlog-roadmap.md](https://github.com/${{ github.repository }}/blob/main/docs/backlog-roadmap.md).

      - name: Publish SharpKind.Cryptography to the PowerShell Gallery
        shell: pwsh
        run: Publish-PSResource -Path ./publish/SharpKind.Cryptography -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
