name: Benchmarks

# Manual, on-demand only: shared GitHub-hosted runners are noisy for
# absolute benchmark timings, and these numbers are read as trends, not
# gates, so this does not run on every push/PR. Trigger it after a
# perf-focused change to record a new data point.
on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      # deployments permission to deploy the GitHub Pages benchmark charts
      deployments: write
      # contents permission to push benchmark history to the gh-pages branch
      contents: write
      # actions permission to ask the docs workflow to republish the charts
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run EliteSharpLib benchmarks
        working-directory: src/elite/perf/EliteSharpLib.Benchmarks
        run: dotnet run --configuration Release

      - name: Run SharpKind.Input benchmarks
        working-directory: src/useful/perf/SharpKind.Input.Benchmarks
        run: dotnet run --configuration Release

      - name: Run SharpKind.Graphics benchmarks
        working-directory: src/useful/perf/SharpKind.Graphics.Benchmarks
        run: dotnet run --configuration Release

      # Each benchmark class gets its own JSON report and its own chart on
      # the gh-pages dashboard (github-action-benchmark keys history by the
      # `name` input) - add a step here when a new *Benchmarks class is added.
      - name: Record Elite Planet benchmark history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'benchmarkdotnet'
          name: 'Elite: Planet rendering'
          output-file-path: src/elite/perf/EliteSharpLib.Benchmarks/reports/results/EliteSharpLib.Benchmarks.PlanetBenchmarks-report-full-compressed.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true

      - name: Record Elite Sun benchmark history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'benchmarkdotnet'
          name: 'Elite: Sun rendering'
          output-file-path: src/elite/perf/EliteSharpLib.Benchmarks/reports/results/EliteSharpLib.Benchmarks.SunBenchmarks-report-full-compressed.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true

      - name: Record SharpKind.Input Keyboard benchmark history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'benchmarkdotnet'
          name: 'SharpKind.Input: Keyboard'
          output-file-path: src/useful/perf/SharpKind.Input.Benchmarks/reports/results/SharpKind.Input.Benchmarks.KeyboardBenchmarks-report-full-compressed.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true

      - name: Record SharpKind.Graphics SoftwareGraphics benchmark history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'benchmarkdotnet'
          name: 'SharpKind.Graphics: SoftwareGraphics'
          output-file-path: src/useful/perf/SharpKind.Graphics.Benchmarks/reports/results/SharpKind.Graphics.Benchmarks.SoftwareGraphicsBenchmarks-report-full-compressed.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true

      # gh-pages is the store, not the published site: the docs workflow copies
      # these charts into the site it deploys, so a new data point is only
      # visible once that site is rebuilt.
      - name: Republish the documentation site
        run: gh workflow run docs.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
